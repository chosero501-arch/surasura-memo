<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>スロット設定判別</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">

<style>
/* Layout: one scrolling column. Result first, then data counter, then small-role counter, then machine tools.
   Counts use a dot-matrix face like a hall data counter; the highest setting is the only thing in LED amber. */
:root {
  color-scheme: dark;
  --bg: #0e1113;
  --panel: #161a1d;
  --panel2: #1e2327;
  --line: #2c3338;
  --ink: #e8ecee;
  --muted: #93a0a8;
  --led: #ffb23e;
  --led-fg: #1a1204;
  --bar: #39434a;
  --danger: #ff8a7a;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --led-font: "Doto", "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9ece8;
    --panel: #fbfcfa;
    --panel2: #eff2ee;
    --line: #c9cfc9;
    --ink: #1a2125;
    --muted: #55616a;
    --led: #b05400;
    --led-fg: #ffffff;
    --bar: #c3cbc7;
    --danger: #b3362b;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9ece8;
  --panel: #fbfcfa;
  --panel2: #eff2ee;
  --line: #c9cfc9;
  --ink: #1a2125;
  --muted: #55616a;
  --led: #b05400;
  --led-fg: #ffffff;
  --bar: #c3cbc7;
  --danger: #b3362b;
}

html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; box-sizing: border-box; }
/* iPhone zooms the page when a field under 16px gets focus; keep every field at 16px or more */
input, select, textarea { font-size: 16px; }
.num { font-size: 26px; }
.info input[type="date"] { line-height: 1.2; }
:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.head h1 { flex: 1; min-width: 0; margin: 0; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { font-size: 12px; color: var(--danger); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.chip[aria-selected="true"] { border-color: var(--led); color: var(--led); font-weight: 700; }
.chip.add { color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }

/* result */
.verdict { margin: 0 0 12px; font-size: 15px; min-height: 1.6em; }
.verdict b { font-family: var(--led-font); color: var(--led); font-size: 30px; line-height: 1; margin: 0 4px; vertical-align: -3px; }
.rows { display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: 3.4em 1fr 4.4em; align-items: center; gap: 10px; }
.row .lbl { font-size: 14px; color: var(--muted); }
.row .track { height: 12px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.row .fill { height: 100%; background: var(--bar); border-radius: 3px; min-width: 2px; }
.row .pct { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.row.top .lbl, .row.top .pct { color: var(--led); font-weight: 700; }
.row.top .fill { background: var(--led); }
.sums { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.sums span b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.warn { color: var(--danger); }

/* counters */
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px; padding: 10px 0; }
.field + .field { border-top: 1px solid var(--line); }
.field .name { font-weight: 700; }
.field .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.num { width: 8.5em; min-height: 46px; padding: 0 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; text-align: right; font-family: var(--led-font); font-size: 26px; color: var(--led); font-variant-numeric: tabular-nums; }
.step { display: flex; align-items: center; gap: 8px; }
.step .val { min-width: 3.2em; text-align: right; font-family: var(--led-font); font-size: 30px; line-height: 1; color: var(--led); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 48px; padding: 0 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; touch-action: manipulation; }
.btn:active { background: var(--line); }
.btn.plus { background: var(--led); color: var(--led-fg); border-color: var(--led); font-weight: 700; font-size: 20px; }
.btn.small { min-height: 36px; min-width: 36px; padding: 0 10px; font-size: 13px; }
.btn.danger[data-confirm="1"] { color: var(--danger); border-color: var(--danger); }

.gbar { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center; gap: 2px; min-height: 96px; padding: 8px 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; touch-action: manipulation; user-select: none; min-width: 0; }
.tile:active { background: var(--line); }
.tile .tl { font-weight: 700; font-size: 14px; }
.tile .tag { font-weight: 400; font-size: 10px; color: var(--led); margin-left: 4px; }
.tile .tv { font-family: var(--led-font); font-size: 32px; line-height: 1.1; color: var(--led); font-variant-numeric: tabular-nums; }
.tile .tr { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.used { border-color: var(--led); }
.tap { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.tap .big { min-height: 76px; justify-content: space-between; padding: 0 18px; background: var(--led); border-color: var(--led); color: var(--led-fg); font-weight: 700; font-size: 17px; }
.tap .big .val { font-family: var(--led-font); font-size: 40px; line-height: 1; }

details { margin: 0; }
summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 700; color: var(--muted); font-size: 14px; }
summary { list-style: none; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▶"; color: var(--led); font-size: 12px; width: 1.2em; flex: none; }
details[open] > summary::before { content: "▼"; }
summary::after { content: "開く"; margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 1px 10px; flex: none; }
details[open] > summary::after { content: "閉じる"; }
.tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-top: 8px; }
.tools label { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 4px; font-size: 13px; color: var(--muted); }
.tools input[type="text"], .tools select { min-height: 44px; padding: 0 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.info { display: grid; grid-template-columns: minmax(0, 1fr) 5.5em; gap: 8px; }
.info label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.info label.wide { grid-column: 1 / -1; }
.info input { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; min-height: 42px; padding: 0 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); width: 100%; min-width: 0; }
.info .acts { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hist { display: grid; gap: 0; margin-top: 8px; }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.hrow .h1 { font-weight: 700; }
.hrow .h2 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.hrow .res { color: var(--led); font-weight: 700; }
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .ln { fill: none; stroke: var(--led); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--led); }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.sgn { min-width: 48px; font-size: 22px; font-weight: 700; }
.src { font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.src table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.src th, .src td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.src th:first-child, .src td:first-child { text-align: left; }
.src .wrap { overflow-x: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.bigline { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 8px; }
.bigline b { font-family: var(--led-font); font-size: 56px; line-height: 1; color: var(--led); font-variant-numeric: tabular-nums; }
.bigline span { color: var(--muted); font-size: 14px; }
.pos { color: var(--led); font-weight: 700; }
.neg { color: var(--danger); font-weight: 700; }
.verdict b { font-family: inherit; font-size: inherit; margin: 0; vertical-align: baseline; }
.field.stack { grid-template-columns: minmax(0, 1fr); }
.field.stack .step { gap: 8px; }
.field.stack .step .num.s { flex: 1; width: auto; min-width: 0; }
.num.s { width: 6.2em; font-size: 20px; min-height: 46px; padding: 0 8px; }
.hist .h2 { color: var(--muted); font-size: 12px; }
.card > .tools { padding-top: 0; }
.chks { display: grid; gap: 8px; }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; min-height: 48px; }
.chk input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--led); }
.chk span { display: grid; gap: 2px; min-width: 0; }
.chk small { color: var(--muted); font-size: 12px; }
.chk:has(input:checked) { border-color: var(--led); }
.field > div:first-child { min-width: 0; }
[hidden] { display: none !important; }
</style></head><body>

<main class="app" id="app">
  <header class="head">
    <h1>スロット設定判別</h1>
    <span class="sync" id="sync" role="status"></span>
    <button class="btn small" type="button" id="reload" aria-label="再読み込み" title="再読み込み">↻</button>
  </header>

  <section class="card" aria-live="polite" aria-label="判別結果">
    <h2 id="rtitle">設定の可能性</h2>
    <p class="verdict" id="verdict"></p>
    <div class="rows" id="rows"></div>
    <div class="sums" id="sums"></div>
    <p class="note" id="rnote"></p>
  </section>

  <section class="card" aria-label="機種">
    <h2>機種</h2>
    <div class="tools">
      <label>機種を選ぶ
        <select id="mach"></select>
      </label>
    </div>
  </section>

  <section class="card" aria-label="カウンター">
    <h2>カウンター</h2>
    <div class="field">
      <div><label class="name" for="games">通常時のゲーム数</label><div class="sub">AT中・ボーナス中は数えません</div></div>
      <input class="num" id="games" type="text" inputmode="numeric" autocomplete="off" aria-label="通常時のゲーム数">
    </div>
    <div class="field" id="totalField" hidden>
      <div><label class="name" for="total">総ゲーム数</label><div class="sub">通常時とST中を合わせた回転数(下段ベル用)</div></div>
      <input class="num" id="total" type="text" inputmode="numeric" autocomplete="off" aria-label="総ゲーム数">
    </div>
    <div id="metrics"></div>
  </section>

  <section class="card" aria-label="設定示唆">
    <h2>設定示唆(出たものにチェック)</h2>
    <div class="chks" id="hints"></div>
    <p class="note">濃厚・確定として扱う示唆だけを載せています。「奇数示唆」などの弱い示唆は、効き方の数字がないので入れていません。矛盾するチェックが入っても、計算は止まりません。</p>
  </section>

  <section class="card">
    <div class="btns"><button class="btn small danger" type="button" id="reset">この機種の数字をゼロに戻す</button></div>
  </section>

  <section class="card">
    <details>
      <summary>使っている数値と出典</summary>
      <div class="src" style="padding-top:8px">
        <div class="wrap"><table id="spec"></table></div>
        <div id="specNotes" style="display:grid;gap:6px"></div>
      </div>
    </details>
  </section>
</main>

      notes: [GUESS, NOBASE, '機械割は、サイトに記載がありませんでした。']
    },
    {

      ],

      notes: [GUESS, NOBASE]
    },
    {

      metrics: [

      hints: tiers('ボーナス終了画面の塔、222枚OVER、ゴエモン「さんきゅ〜!」', 'ゴエモン吉、333枚OVER、「ご機嫌っしょ!」', 'ノブナガ&ミツヒデ、444枚OVER、「攻めどきっしょ!」', '乙女集合(優)、555枚OVER、「気分アゲアゲだし!」', 'ノブナガ(極)、666枚OVER、石川ゴエモン口上'),
      notes: [GUESS, NOBASE, '機械割は、サイトに記載がありませんでした。']
    },
    {

          note: 'CZからATに入るため、ATと重なる分を考えて、半分の重みで見ています。' }
      ],
      hints: tiers('英子&赤兎馬カンフー、222枚OVER、ミニキャラ2人、銅', '太人&孔明、ミニキャラ3人、銀', '英子&七海、456枚OVER、ミニキャラ4人、金', '孔明(赤背景)、555枚OVER、ミニキャラ5人', 'ケロット着ぐるみ、666枚OVER、金孔明、虹'),
      notes: [GUESS, NOBASE, '機械割は、サイトに記載がありませんでした。']
    },
    {
      id: 'in', name: 'スマスロ とある魔術の禁書目録2', payout: null, soft: true,
      metrics: [
        { k: 'at', label: 'AT初当り', unit: '回', w: 1, rates: [398.8, 394.5, 389.6, 369.5, 358.0, 338.4] },
        { k: 'cz', label: 'CZ(合算)', unit: '回', w: 0.5, rates: [235.6, 233.4, 230.8, 222.3, 215.8, 207.2],
          note: 'CZからATに入るため、ATと重なる分を考えて、半分の重みで見ています。' }
      ],
      hints: tiers('174枚OVER、エンディングの「やったあ」系、銅コイン', '「すごい」系、銀コイン', '456枚OVER、美琴+初春の終了画面、「とっても美味しい」系、金コイン', '「すっごくうれしい」系、DANGER柄コイン', '220枚OVER、当麻ハーレム、「おめでとう」系、虹コイン'),
      notes: [GUESS, NOBASE, '機械割は、サイトに記載がありませんでした。']
    },
    {
      id: 'sa', name: 'スロット ソードアート・オンラインII', payout: null, soft: true,
      metrics: [
        { k: 'at', label: 'AT初当り', unit: '回', w: 1, rates: [386.2, 364.3, 368.1, 326.8, 340.6, 269.6] },
        { k: 'cz', label: 'CZ', unit: '回', w: 0.5, rates: [238.4, 232.3, 232.7, 218.9, 225.2, 191.7],
          note: 'CZからATに入るため、ATと重なる分を考えて、半分の重みで見ています。' }
      ],
      hints: tiers('AT終了画面のワイシャツ、銅(コパンダ)', 'お風呂、銀', '水着、ミニキャラの詩乃・ユイ、金', '稲妻柄', 'パジャマ、シノン&キリト、アスナ&ユウキ、虹'),
      notes: [GUESS, NOBASE, 'この機種は設定ごとの差が一直線ではなく、設定2と3、設定4と5で逆転しています(サイトの数字のまま)。']
    }
  ];
  function machineOf(id) {
    for (var i = 0; i < MACHINES.length; i++) if (MACHINES[i].id === id) return MACHINES[i];
    return MACHINES[0];
  }

  /* rec: { games, counts:{k:n}, hints:[id] } */
  function posterior(mach, rec) {
    var N = rec.games, out = { p: [1 / 6, 1 / 6, 1 / 6, 1 / 6, 1 / 6, 1 / 6], hasData: false, error: '', used: [], hinted: false };
    var ll = [0, 0, 0, 0, 0, 0], any = false;
    for (var m = 0; m < mach.metrics.length; m++) {
      var mt = mach.metrics[m], k = rec.counts[mt.k] || 0;
      var Nm = mt.base === 'total' ? (rec.total || 0) : N;
      if (k > 0 && Nm === 0) { out.error = mt.label + 'を数えるには、' + (mt.base === 'total' ? '総ゲーム数' : '通常時のゲーム数') + 'を入れてください。'; return out; }
      if (k > Nm) { out.error = mt.label + 'の回数が、ゲーム数より多くなっています。'; return out; }
      if (Nm <= 0) continue;
      any = true;
      if (k > 0) out.used.push(mt.label);
      for (var s = 0; s < 6; s++) {
        var p = 1 / mt.rates[s];
        ll[s] += mt.w * (k * Math.log(p) + (Nm - k) * Math.log(1 - p));
      }
    }
    var hs = rec.hints || [];
    mach.hints.forEach(function (h) {
      if (hs.indexOf(h.id) < 0) return;
      any = true; out.hinted = true;
      for (var s = 0; s < 6; s++) if (h.allow.indexOf(s + 1) < 0) ll[s] += Math.log(mach.soft ? 0.05 : 0.01);
    });
    if (!any) return out;
    var mx = Math.max.apply(null, ll), sum = 0, e = [];
    for (var i = 0; i < 6; i++) { e.push(Math.exp(ll[i] - mx)); sum += e[i]; }
    out.p = e.map(function (x) { return x / sum; });
    out.hasData = true;
    return out;
  }
  /*ENDMATH*/

  var LS_KEY = 'slot-hantei-v1';
  function $(id) { return document.getElementById(id); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function num(v, max) {
    var n = parseInt(String(v).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[^\d]/g, ''), 10);
    if (isNaN(n)) n = 0;
    return Math.min(max || 999999, Math.max(0, n));
  }
  function fmt(n) { return Number(n).toLocaleString('ja-JP'); }

  function blankRec() { return { games: 0, total: 0, counts: {}, hints: [] }; }
  function normRec(r, mach) {
    var o = blankRec(); r = r || {};
    o.games = num(r.games); o.total = num(r.total);
    mach.metrics.forEach(function (m) { o.counts[m.k] = num(r.counts && r.counts[m.k]); });
    o.hints = (Array.isArray(r.hints) ? r.hints : []).filter(function (id) { return mach.hints.some(function (h) { return h.id === id; }); });
    return o;
  }
  function normalize(st) {
    if (!st || typeof st !== 'object') return null;
    var o = { mach: machineOf(st.mach).id, by: {}, updated: Number(st.updated) || 0 };
    MACHINES.forEach(function (m) { o.by[m.id] = normRec(st.by && st.by[m.id], m); });
    return o;
  }
  var state = normalize({ mach: MACHINES[0].id });
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) { var n0 = normalize(JSON.parse(raw)); if (n0) state = n0; }
  } catch (e) { /* storage unavailable */ }

  function mach() { return machineOf(state.mach); }
  function rec() { return state.by[state.mach]; }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
  function touch() { state.updated = Date.now(); saveLocal(); queue(); }
  function setIfIdle(el, v) { if (document.activeElement !== el) el.value = v; }

  function renderMachineSelect() {
    var h = '';
    MACHINES.forEach(function (m) { h += '<option value="' + m.id + '">' + m.name + '</option>'; });
    $('mach').innerHTML = h; $('mach').value = state.mach;
  }
  function renderMetrics() {
    var m = mach(), box = $('metrics');
    if (box.dataset.mach !== m.id) {
      var h = '';
      m.metrics.forEach(function (mt) {
        h += '<div class="field"><div><div class="name">' + mt.label + '</div><div class="sub" id="r_' + mt.k + '"></div></div>' +
          '<div class="step"><button class="btn" type="button" data-act="dec" data-k="' + mt.k + '" aria-label="' + mt.label + 'を1減らす">−</button>' +
          '<span class="val" id="v_' + mt.k + '">0</span>' +
          '<button class="btn plus" type="button" data-act="inc" data-k="' + mt.k + '" aria-label="' + mt.label + 'を1増やす">+</button></div></div>';
      });
      box.innerHTML = h; box.dataset.mach = m.id;
    }
    var r = rec();
    m.metrics.forEach(function (mt) {
      var c = r.counts[mt.k] || 0;
      $('v_' + mt.k).textContent = c;
      var range = '設定1〜6: 1/' + mt.rates[0].toFixed(0) + '〜1/' + mt.rates[5].toFixed(0);
      var base = mt.base === 'total' ? r.total : r.games;
      $('r_' + mt.k).textContent = c && base ? '1/' + (base / c).toFixed(1) + '(' + range + ')' : range;
    });
  }
  function renderHints() {
    var m = mach(), r = rec(), h = '';
    m.hints.forEach(function (x) {
      h += '<label class="chk"><input type="checkbox" data-hint="' + x.id + '"' + (r.hints.indexOf(x.id) >= 0 ? ' checked' : '') + '><span><b>' + x.label + '</b><small>' + x.ex + '</small></span></label>';
    });
    $('hints').innerHTML = h;
  }
  function renderResult() {
    var m = mach(), r = rec(), res = posterior(m, r), best = 0;
    for (var i = 1; i < 6; i++) if (res.p[i] > res.p[best]) best = i;
    $('rtitle').textContent = '設定の可能性(' + m.name + ')';
    if (res.error) $('verdict').innerHTML = '<span class="warn">' + res.error + '</span>';
    else if (!res.hasData) $('verdict').textContent = 'ゲーム数を入れるか、設定示唆にチェックを入れると、計算します。';
    else $('verdict').innerHTML = '設定<b>' + (best + 1) + '</b>が最有力(' + (res.p[best] * 100).toFixed(1) + '%)';
    var h = '';
    for (var s = 0; s < 6; s++) {
      var pct = res.p[s] * 100, top = res.hasData && s === best;
      h += '<div class="row' + (top ? ' top' : '') + '"><span class="lbl">設定' + (s + 1) + '</span><span class="track"><span class="fill" style="width:' + pct.toFixed(1) + '%"></span></span><span class="pct">' + pct.toFixed(1) + '%</span></div>';
    }
    $('rows').innerHTML = h; $('rows').style.opacity = res.hasData ? '1' : '0.45';
    var ge4 = res.p[3] + res.p[4] + res.p[5], ge5 = res.p[4] + res.p[5];
    $('sums').innerHTML = res.hasData && !res.error ? '<span>設定4以上<b>' + (ge4 * 100).toFixed(0) + '%</b></span><span>設定5以上<b>' + (ge5 * 100).toFixed(0) + '%</b></span><span>設定6<b>' + (res.p[5] * 100).toFixed(0) + '%</b></span>' : '';
    var t = '';
    if (res.hasData && !res.error) {
      var parts = [];
      if (r.games) parts.push('通常時 ' + fmt(r.games) + 'G');
      if (r.total) parts.push('総 ' + fmt(r.total) + 'G');
      if (res.used.length) parts.push(res.used.join('・') + 'の回数');
      if (res.hinted) parts.push('設定示唆');
      t = '計算に使ったもの: ' + parts.join('、') + '。ゲーム数が少ないうちは、結果が大きく動きます。';
    }
    $('rnote').textContent = t;
  }
  function renderSpec() {
    var m = mach(), h = '<tr><th>設定</th>' + (m.payout ? '<th>機械割</th>' : '');
    m.metrics.forEach(function (mt) { h += '<th>' + mt.label + '</th>'; });
    h += '</tr>';
    for (var s = 0; s < 6; s++) {
      h += '<tr><td>' + (s + 1) + '</td>' + (m.payout ? '<td>' + m.payout[s].toFixed(1) + '%</td>' : '');
      m.metrics.forEach(function (mt) { h += '<td>1/' + mt.rates[s].toFixed(1) + '</td>'; });
      h += '</tr>';
    }
    $('spec').innerHTML = h;
    var n = '';
    m.metrics.forEach(function (mt) { if (mt.note) n += '<div>' + mt.label + ': ' + mt.note + '</div>'; });
    m.notes.forEach(function (t) { n += '<div>' + t + '</div>'; });
    $('specNotes').innerHTML = n;
  }
  function renderTotal() {
    var has = mach().metrics.some(function (m) { return m.base === 'total'; });
    $('totalField').hidden = !has;
    setIfIdle($('total'), rec().total ? fmt(rec().total) : '');
  }
  function renderAll() {
    renderMachineSelect(); renderTotal();
    setIfIdle($('games'), rec().games ? fmt(rec().games) : '');
    renderMetrics(); renderHints(); renderResult(); renderSpec();
  }

  /* ---------- events ---------- */
  $('mach').addEventListener('change', function (e) { state.mach = e.target.value; touch(); renderAll(); });
  $('games').addEventListener('input', function (e) { rec().games = num(e.target.value); touch(); renderMetrics(); renderResult(); });
  $('total').addEventListener('input', function (e) { rec().total = num(e.target.value); touch(); renderMetrics(); renderResult(); });
  $('total').addEventListener('blur', function () { $('total').value = rec().total ? fmt(rec().total) : ''; });
  $('games').addEventListener('blur', function () { $('games').value = rec().games ? fmt(rec().games) : ''; });
  $('hints').addEventListener('change', function (e) {
    var id = e.target.dataset && e.target.dataset.hint;
    if (!id) return;
    var r = rec(), i = r.hints.indexOf(id);
    if (e.target.checked && i < 0) r.hints.push(id);
    if (!e.target.checked && i >= 0) r.hints.splice(i, 1);
    touch(); renderResult();
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.id === 'reload') { location.reload(); return; }
    if (t.dataset.act === 'inc' || t.dataset.act === 'dec') {
      var r = rec(), k = t.dataset.k;
      r.counts[k] = Math.max(0, (r.counts[k] || 0) + (t.dataset.act === 'inc' ? 1 : -1));
      touch(); renderMetrics(); renderResult(); return;
    }
    if (t.id === 'reset') {
      if (t.dataset.confirm !== '1') {
        t.dataset.confirm = '1'; t.textContent = 'もう一度押すと実行します';
        setTimeout(function () { t.dataset.confirm = ''; t.textContent = 'この機種の数字をゼロに戻す'; }, 3000);
        return;
      }
      state.by[state.mach] = normRec(null, mach()); t.dataset.confirm = ''; t.textContent = 'この機種の数字をゼロに戻す';
      touch(); renderAll();
    }
  });

  /* ---------- sync (private to each signed-in viewer; local only elsewhere) ---------- */
  var col = null, dirty = false, flushT = null, flushing = false;
  function setSync(t) { $('sync').textContent = t; }
  function queue() { if (!col) return; dirty = true; clearTimeout(flushT); flushT = setTimeout(flush, 1000); }
  async function flush() {
    if (!col || flushing || !dirty) return;
    flushing = true; dirty = false;
    var retry = false;
    try {
      await col.doc('slot').set({ v: 1, updated: state.updated, mach: state.mach, by: state.by });
      setSync('');
    } catch (e) {
      setSync('同期できません');
      if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { dirty = true; retry = true; }
    } finally {
      flushing = false;
      if (dirty) { clearTimeout(flushT); flushT = setTimeout(flush, retry ? 8000 : 1000); }
    }
  }
  async function initCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      var db = await window.claude.use('db'), user = await window.claude.use('user');
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      col = db.collection('data/users/' + uid);
      col.doc('slot').onSnapshot(function (snap) {
        if (!snap.exists) { if (state.updated > 0) queue(); return; }
        var v = snap.data(), remoteT = Number(v.updated) || 0;
        if (remoteT > state.updated) {
          var next = normalize(clone(v));
          if (next) { state = next; saveLocal(); renderAll(); }
        } else if (state.updated > remoteT) queue();
      }, function () { col = null; });
    } catch (e) { col = null; }
  }

  renderAll();
  initCloud();
})();
