<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>ジャグラーシリーズ設定判別カウンター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700&display=swap">
<style>
/* Layout: one scrolling column. Result first, then data counter, then small-role counter, then machine tools.
   Counts use a dot-matrix face like a hall data counter; the highest setting is the only thing in LED amber. */
:root {
  color-scheme: dark;
  --bg: #0e1113;
  --panel: #161a1d;
  --panel2: #1e2327;
  --line: #2c3338;
  --ink: #e8ecee;
  --muted: #93a0a8;
  --led: #ffb23e;
  --led-fg: #1a1204;
  --bar: #39434a;
  --danger: #ff8a7a;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --led-font: "Doto", "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9ece8;
    --panel: #fbfcfa;
    --panel2: #eff2ee;
    --line: #c9cfc9;
    --ink: #1a2125;
    --muted: #55616a;
    --led: #b05400;
    --led-fg: #ffffff;
    --bar: #c3cbc7;
    --danger: #b3362b;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9ece8;
  --panel: #fbfcfa;
  --panel2: #eff2ee;
  --line: #c9cfc9;
  --ink: #1a2125;
  --muted: #55616a;
  --led: #b05400;
  --led-fg: #ffffff;
  --bar: #c3cbc7;
  --danger: #b3362b;
}

html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; box-sizing: border-box; }
/* iPhone zooms the page when a field under 16px gets focus; keep every field at 16px or more */
input, select, textarea { font-size: 16px; }
.num { font-size: 26px; }
.info input[type="date"] { line-height: 1.2; }
:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.head h1 { flex: 1; min-width: 0; margin: 0; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { font-size: 12px; color: var(--danger); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.chip[aria-selected="true"] { border-color: var(--led); color: var(--led); font-weight: 700; }
.chip.add { color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }

/* result */
.verdict { margin: 0 0 12px; font-size: 15px; min-height: 1.6em; }
.verdict b { font-family: var(--led-font); color: var(--led); font-size: 30px; line-height: 1; margin: 0 4px; vertical-align: -3px; }
.rows { display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: 3.4em 1fr 4.4em; align-items: center; gap: 10px; }
.row .lbl { font-size: 14px; color: var(--muted); }
.row .track { height: 12px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.row .fill { height: 100%; background: var(--bar); border-radius: 3px; min-width: 2px; }
.row .pct { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.row.top .lbl, .row.top .pct { color: var(--led); font-weight: 700; }
.row.top .fill { background: var(--led); }
.sums { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.sums span b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.warn { color: var(--danger); }

/* counters */
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px; padding: 10px 0; }
.field + .field { border-top: 1px solid var(--line); }
.field .name { font-weight: 700; }
.field .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.num { width: 8.5em; min-height: 46px; padding: 0 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; text-align: right; font-family: var(--led-font); font-size: 26px; color: var(--led); font-variant-numeric: tabular-nums; }
.step { display: flex; align-items: center; gap: 8px; }
.step .val { min-width: 3.2em; text-align: right; font-family: var(--led-font); font-size: 30px; line-height: 1; color: var(--led); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 48px; padding: 0 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; touch-action: manipulation; }
.btn:active { background: var(--line); }
.btn.plus { background: var(--led); color: var(--led-fg); border-color: var(--led); font-weight: 700; font-size: 20px; }
.btn.small { min-height: 36px; min-width: 36px; padding: 0 10px; font-size: 13px; }
.btn.danger[data-confirm="1"] { color: var(--danger); border-color: var(--danger); }

.gbar { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center; gap: 2px; min-height: 96px; padding: 8px 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; touch-action: manipulation; user-select: none; min-width: 0; }
.tile:active { background: var(--line); }
.tile .tl { font-weight: 700; font-size: 14px; }
.tile .tag { font-weight: 400; font-size: 10px; color: var(--led); margin-left: 4px; }
.tile .tv { font-family: var(--led-font); font-size: 32px; line-height: 1.1; color: var(--led); font-variant-numeric: tabular-nums; }
.tile .tr { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.used { border-color: var(--led); }
.tap { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.tap .big { min-height: 76px; justify-content: space-between; padding: 0 18px; background: var(--led); border-color: var(--led); color: var(--led-fg); font-weight: 700; font-size: 17px; }
.tap .big .val { font-family: var(--led-font); font-size: 40px; line-height: 1; }

details { margin: 0; }
summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 700; color: var(--muted); font-size: 14px; }
summary { list-style: none; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▶"; color: var(--led); font-size: 12px; width: 1.2em; flex: none; }
details[open] > summary::before { content: "▼"; }
summary::after { content: "開く"; margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 1px 10px; flex: none; }
details[open] > summary::after { content: "閉じる"; }
.tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-top: 8px; }
.tools label { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 4px; font-size: 13px; color: var(--muted); }
.tools input[type="text"], .tools select { min-height: 44px; padding: 0 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.info { display: grid; grid-template-columns: minmax(0, 1fr) 5.5em; gap: 8px; }
.info label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.info label.wide { grid-column: 1 / -1; }
.info input { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; min-height: 42px; padding: 0 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); width: 100%; min-width: 0; }
.info .acts { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hist { display: grid; gap: 0; margin-top: 8px; }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.hrow .h1 { font-weight: 700; }
.hrow .h2 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.hrow .res { color: var(--led); font-weight: 700; }
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .ln { fill: none; stroke: var(--led); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--led); }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.sgn { min-width: 48px; font-size: 22px; font-weight: 700; }
.src { font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.src table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.src th, .src td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.src th:first-child, .src td:first-child { text-align: left; }
.src .wrap { overflow-x: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style></head><body>

<main class="app" id="app">
  <header class="head">
    <h1>ジャグラー設定判別</h1>
    <span class="sync" id="sync" role="status"></span>
    <button class="btn small" type="button" id="reload" aria-label="再読み込み" title="再読み込み">↻</button>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="台の切り替え"></div>






  <section class="card" aria-live="polite" aria-label="判別結果">
    <h2 id="rtitle">設定の可能性</h2>
    <p class="verdict" id="verdict"></p>
    <div class="rows" id="rows"></div>
    <div class="sums" id="sums"></div>
    <p class="note" id="rnote"></p>
  </section>

  <section class="card" aria-label="小役カウンター">
    <h2>小役カウンター</h2>
    <div class="gbar">
      <div>
        <label class="name" for="grapeGames">数えたゲーム数</label>
        <div class="sub">どれかを押すと、このゲーム数と総回転数が1ずつ増えます</div>
      </div>
      <input class="num" id="grapeGames" type="text" inputmode="numeric" autocomplete="off" aria-label="数えたゲーム数" style="width:7em">
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="btns" style="margin-top:46px">
      <button class="btn small" type="button" id="undoTap" disabled>1つ取り消す</button>
      <button class="btn small" type="button" data-act="grapeSync">総回転数と同じにする</button>
    </div>
    <p class="note" id="tnote"></p>
  </section>

  <section class="card" aria-label="データカウンター">
    <h2>データカウンター</h2>
    <div class="field">
      <label class="name" for="games">総回転数</label>
      <input class="num" id="games" type="text" inputmode="numeric" autocomplete="off" aria-label="総回転数">
    </div>
    <div class="field">
      <div><div class="name">BIG</div><div class="sub" id="bigRate"></div></div>
      <div class="step">
        <button class="btn" type="button" data-act="big-" aria-label="BIGを1減らす">−</button>
        <span class="val" id="bigVal">0</span>
        <button class="btn plus" type="button" data-act="big+" aria-label="BIGを1増やす">+</button>
      </div>
    </div>
    <div class="field">
      <div><div class="name">REG</div><div class="sub" id="regRate"></div></div>
      <div class="step">
        <button class="btn" type="button" data-act="reg-" aria-label="REGを1減らす">−</button>
        <span class="val" id="regVal">0</span>
        <button class="btn plus" type="button" data-act="reg+" aria-label="REGを1増やす">+</button>
      </div>
    </div>
    <div class="field">
      <div><div class="name">ペカり回数(合算値)</div><div class="sub" id="totRate"></div></div>
      <div class="step"><span class="val" id="totVal">0</span></div>
    </div>
  </section>

  <section class="card" aria-label="投入・差枚・グラフ">
    <details>
      <summary>投入枚数・差枚数・グラフ</summary>
      <div style="padding-top:6px">
        <div class="field">
          <label class="name" for="inv">投入枚数</label>
          <input class="num" id="inv" type="text" inputmode="numeric" autocomplete="off" aria-label="投入枚数" style="width:8.5em">
        </div>
        <div class="field">
          <label class="name" for="net">差枚数</label>
          <div class="step">
            <button class="btn sgn" type="button" data-act="netSign" id="netSign" aria-label="プラスとマイナスの切り替え">＋</button>
            <input class="num" id="net" type="text" inputmode="numeric" autocomplete="off" aria-label="差枚数の数字" style="width:7em">
          </div>
        </div>
        <div class="sums" id="medSums"></div>
        <svg class="chart" id="chart" viewBox="0 0 340 180" role="img" aria-label="差枚数のグラフ"></svg>
        <div class="btns" style="margin-top:10px">
          <button class="btn small" type="button" data-act="ptUndo">最後の点を消す</button>
          <button class="btn small" type="button" data-act="ptClear">グラフをクリア</button>
        </div>
        <p class="note">差枚数を入れて確定すると(キーボードを閉じるか、＋/−を押すと)、そのときの総回転数でグラフに点が1つ増えます。横軸は総回転数、縦軸は差枚数です。</p>
      </div>
    </details>
  </section>

  <section class="card" aria-label="日付・店舗・台番">
    <details open>
    <summary id="infoSum">日付・店舗名・台番</summary>
    <div class="info" style="padding-top:8px">
      <label>日付(自動)<input type="text" id="mdate" readonly tabindex="-1" aria-readonly="true" style="color:var(--muted);pointer-events:none"></label>
      <label>台番<input type="text" id="mno" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="例 123"></label>
      <label class="wide">店舗名<input type="text" id="mshop" autocomplete="off" maxlength="30" placeholder="例 ○○ホール"></label>
    </div>
    </details>
  </section>


  <section class="card">
    <h2>台の管理・ぶどうの設定</h2>
      <div class="tools">
        <label>台の名前
          <input type="text" id="mname" autocomplete="off" maxlength="20">
        </label>
        <label>機種
          <select id="mach"></select>
        </label>
        <label>ぶどう確率の見積もり
          <select id="preset"></select>
        </label>
        <div class="btns">
          <button class="btn small danger" type="button" id="reset">この台の数字をゼロに戻す</button>
          <button class="btn small danger" type="button" id="remove">この台を削除</button>
        </div>
      </div>
  </section>

  <section class="card" aria-label="保存">
    <h2>保存</h2>
      <div class="btns">
        <button class="btn small" type="button" data-act="saveRec" id="saveRec">この台を記録に保存</button>
        <button class="btn small" type="button" data-act="saveImg" id="saveImg">画像で保存</button>
        <span class="note" style="margin:0">日付が過ぎた台は、翌日に記録へ自動保存して消えます</span>
      </div>
    <details style="margin-top:6px">
      <summary id="histSum">保存した記録</summary>
      <div class="tools">
        <div class="btns">
          <button class="btn small" type="button" data-act="csv">CSVで書き出す</button>
          <button class="btn small danger" type="button" data-act="hclear" id="hclear">記録をすべて消す</button>
        </div>
        <div class="hist" id="hist"></div>
      </div>
    </details>
  </section>

  <section class="card">
    <details>
      <summary>使っている数値と出典</summary>
      <div class="src" style="padding-top:8px">
        <div class="wrap"><table id="spec"></table></div>
        <div id="specNotes" style="display:grid;gap:6px"></div>
        <div>結果は「設定がいくつか」の断定ではなく、入力した数字から計算した可能性の目安です。</div>
      </div>
    </details>
  </section>
</main>

               B: { label: '推定B(ホール実戦値・ジャグラートピックス)', short: 'ぶどうB', v: [5.95, 5.86, 5.82, 5.79, 5.75, 5.65] } },

    var h = '';
    list.forEach(function (x) {
      var place = [x.shop, x.no ? x.no + '番' : ''].filter(Boolean).join(' ');
      h += '<div class="hrow"><div><div class="h1">' + esc(x.date) + ' ' + esc(place || x.name) + ' <span style="font-weight:400;color:var(--muted)">' + esc(machineOf(x.mach).name) + '</span></div>' +
        '<div class="h2">' + fmt(x.games) + 'G BIG' + x.big + ' REG' + x.reg + ' ぶどう' + x.grape + '/' + fmt(x.grapeGames) + 'G' +
        (x.inv ? ' 差枚' + (x.net > 0 ? '+' : '') + fmt(x.net) : '') + (x.top ? ' → <span class="res">設定' + x.top + 'が最有力 ' + x.pct + '%</span>' : '') + '</div></div>' +
        '<button class="btn small" type="button" data-act="hdel" data-hid="' + esc(x.id) + '" aria-label="この記録を削除">削除</button></div>';
    });
    $('hist').innerHTML = h;
  }
  function exportCsv() {
    var head = ['日付', '店舗名', '台番', '機種', '台の名前', '総回転数', 'BIG', 'REG', '数えたゲーム数', 'ぶどう', 'チェリー', 'ベル', 'ピエロ', 'リプレイ', 'ハズレ', '投入枚数', '差枚数', '最有力の設定', '可能性%'];
    function q(v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = [head.join(',')];
    state.history.slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || '') || a.saved - b.saved; }).forEach(function (x) {
      rows.push([x.date, x.shop, x.no, machineOf(x.mach).name, x.name, x.games, x.big, x.reg, x.grapeGames, x.grape, x.cherry, x.bell, x.clown, x.replay, x.miss, x.inv, x.net, x.top || '', x.top ? x.pct : ''].map(q).join(','));
    });
    var data = '\ufeff' + rows.join('\r\n'), fname = 'juggler-' + today() + '.csv';
    (async function () {
      try {
        var dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
        if (dl) { await dl.save({ filename: fname, data: data }); return; }
      } catch (e) { if (e && e.code === 'declined') return; }
      try {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' }));
        a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { setSync('書き出せません'); }
    })();
  }

  function saveImage(btn) {
    var m = cur(), sp = machineOf(m.mach), r = posterior(m, sp, m.preset);
    var W = 760, P = 36, y = 0, best = 0;
    for (var i = 1; i < 6; i++) if (r.p[i] > r.p[best]) best = i;
    var c = document.createElement('canvas'), dpr = 2;
    c.width = W * dpr; c.height = 1700 * dpr;
    var g = c.getContext('2d'); g.scale(dpr, dpr);
    var F = '"Hiragino Sans","Yu Gothic UI","Noto Sans JP","BIZ UDPGothic",sans-serif';
    g.fillStyle = '#fbfcfa'; g.fillRect(0, 0, W, 1700);
    function t(txt, x, yy, size, col, bold, align) { g.font = (bold ? '700 ' : '400 ') + size + 'px ' + F; g.fillStyle = col; g.textAlign = align || 'left'; g.fillText(txt, x, yy); }
    var INK = '#1a2125', MUT = '#55616a', LED = '#b05400', LINE = '#c9cfc9';
    y = 56; t('ジャグラーシリーズ設定判別カウンター', P, y, 26, INK, true);
    y += 38; t(m.date + (m.shop ? '  ' + m.shop : '') + (m.no ? '  ' + m.no + '番' : ''), P, y, 22, INK, true);
    y += 32; t(sp.name + (m.name ? '(' + m.name + ')' : ''), P, y, 20, MUT);
    y += 30; g.fillStyle = LINE; g.fillRect(P, y, W - 2 * P, 2);
    y += 52;
    if (r.error) t(r.error, P, y, 22, '#b3362b', true);
    else if (!r.hasData) t('総回転数が未入力です', P, y, 22, MUT);
    else t('設定' + (best + 1) + 'が最有力(' + (r.p[best] * 100).toFixed(1) + '%)', P, y, 34, LED, true);
    y += 20;
    for (var s2 = 0; s2 < 6; s2++) {
      y += 40;
      var pct = r.p[s2] * 100, top = r.hasData && s2 === best;
      t('設定' + (s2 + 1), P, y, 20, top ? LED : MUT, top);
      g.fillStyle = '#eff2ee'; g.fillRect(P + 90, y - 18, 480, 18);
      g.fillStyle = top ? LED : '#c3cbc7'; g.fillRect(P + 90, y - 18, Math.max(2, 480 * pct / 100), 18);
      t(pct.toFixed(1) + '%', W - P, y, 20, top ? LED : INK, top, 'right');
    }
    if (r.hasData && !r.error) {
      y += 46;
      t('設定4以上 ' + ((r.p[3] + r.p[4] + r.p[5]) * 100).toFixed(0) + '%   設定5以上 ' + ((r.p[4] + r.p[5]) * 100).toFixed(0) + '%   設定6 ' + (r.p[5] * 100).toFixed(0) + '%', P, y, 20, INK);
    }
    y += 24; g.fillStyle = LINE; g.fillRect(P, y, W - 2 * P, 2);
    function rate(n, d) { return n && d ? '1/' + (d / n).toFixed(1) : '1/—'; }
    y += 46; t('データカウンター', P, y, 20, MUT, true);
    y += 44; t('総回転数  ' + fmt(m.games) + 'G', P, y, 26, INK, true);
    y += 44; t('BIG  ' + m.big + '回  ' + rate(m.big, m.games), P, y, 24, INK);
    y += 40; t('REG  ' + m.reg + '回  ' + rate(m.reg, m.games), P, y, 24, INK);
    y += 40; t('ペカり回数(合算値)  ' + (m.big + m.reg) + '回  ' + rate(m.big + m.reg, m.games), P, y, 24, INK);
    var net = netOf(m);
    if (m.inv > 0 || m.na > 0) {
      y += 40; t('投入 ' + fmt(m.inv) + '枚   差枚 ' + (net > 0 ? '+' : '') + fmt(net) + '枚' + (m.inv > 0 ? '   出玉率 ' + ((m.inv + net) / m.inv * 100).toFixed(1) + '%' : ''), P, y, 24, INK);
    }
    if (m.pts.length) {
      var cd = chartData(m), gx = P + 70, gw = W - 2 * P - 80, gy = y + 30, gh = 200;
      function CX(v) { return gx + gw * v / cd.xmax; }
      function CY(v) { return gy + gh * (cd.ymax - v) / (cd.ymax - cd.ymin); }
      g.strokeStyle = LINE; g.lineWidth = 2; g.strokeRect(gx, gy, gw, gh);
      g.setLineDash([8, 6]); g.strokeStyle = MUT; g.beginPath(); g.moveTo(gx, CY(0)); g.lineTo(gx + gw, CY(0)); g.stroke(); g.setLineDash([]);
      g.strokeStyle = LED; g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath();
      cd.pts.forEach(function (q, i) { if (i) g.lineTo(CX(q[0]), CY(q[1])); else g.moveTo(CX(q[0]), CY(q[1])); }); g.stroke();
      g.fillStyle = LED; cd.pts.forEach(function (q) { g.beginPath(); g.arc(CX(q[0]), CY(q[1]), 5, 0, 7); g.fill(); });
      t(fmt(cd.ymax), gx - 8, gy + 14, 16, MUT, false, 'right'); t(fmt(cd.ymin), gx - 8, gy + gh, 16, MUT, false, 'right'); t('0', gx - 8, CY(0) + 5, 16, MUT, false, 'right');
      t('0G', gx, gy + gh + 22, 16, MUT); t(fmt(cd.xmax) + 'G', gx + gw, gy + gh + 22, 16, MUT, false, 'right');
      y = gy + gh + 30;
    }
    y += 30; g.fillStyle = LINE; g.fillRect(P, y, W - 2 * P, 2);
    y += 46; t('小役カウンター(数えたゲーム数 ' + fmt(m.grapeGames) + 'G)', P, y, 20, MUT, true);
    var gUsed = m.preset !== 'off' && !!sp.grape[m.preset];
    KINDS.forEach(function (x) {
      y += 40;
      t(x.label + (x.used && gUsed ? '(判別に使用)' : ''), P, y, 22, INK);
      t(m[x.k] + '回   ' + (m[x.k] && m.grapeGames ? '1/' + (m.grapeGames / m[x.k]).toFixed(x.d) : '1/—'), W - P, y, 22, INK, false, 'right');
    });
    y += 44;
    t('入力した数字から計算した可能性の目安です。', P, y, 16, MUT);
    var H = y + 30, out = document.createElement('canvas');
    out.width = W * dpr; out.height = H * dpr;
    out.getContext('2d').drawImage(c, 0, 0);
    var fname = 'juggler-' + m.date + (m.no ? '-' + m.no : '') + '.png';
    out.toBlob(function (blob) {
      if (!blob) { setSync('画像を作れません'); return; }
      (async function () {
        try {
          var dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
          if (dl) { await dl.save({ filename: fname, data: blob }); return; }
        } catch (e) { if (e && e.code === 'declined') return; }
        try {
          var file = new File([blob], fname, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
        } catch (e) { if (e && e.name === 'AbortError') return; }
        try {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = fname;
          document.body.appendChild(a); a.click(); a.remove();
        } catch (e) { setSync('保存できません'); }
      })();
    }, 'image/png');
  }

  function renderTools() {
    var m = cur();
    setIfIdle($('mname'), m.name);
    setIfIdle($('mdate'), m.date);
    $('infoSum').textContent = '日付・店舗名・台番  ' + m.date.slice(5).replace('-', '/') + (m.shop ? '  ' + m.shop : '') + (m.no ? '  ' + m.no + '番' : '');
    setIfIdle($('mshop'), m.shop);
    setIfIdle($('mno'), m.no);
    var sp = machineOf(m.mach);
    var mh = '';
    MACHINES.forEach(function (x) { mh += '<option value="' + x.id + '">' + x.name + '</option>'; });
    if ($('mach').innerHTML !== mh) $('mach').innerHTML = mh;
    $('mach').value = sp.id;
    var ph = '';
    Object.keys(sp.grape).forEach(function (k) { ph += '<option value="' + k + '">' + sp.grape[k].label + '</option>'; });
    ph += '<option value="off">ぶどうは判別に使わない</option>';
    $('preset').innerHTML = ph;
    $('preset').value = m.preset;
    $('preset').disabled = !Object.keys(sp.grape).length;
    renderSpec();
  }

  function renderAll() { renderChips(); renderCounts(); renderResult(); renderTools(); renderHist(); }

  function renderSpec() {
    var sp = machineOf(cur().mach), keys = Object.keys(sp.grape);
    var h = '<tr><th>設定</th><th>BIG</th><th>REG</th><th>合算</th><th>機械割</th>';
    keys.forEach(function (k) { h += '<th>' + sp.grape[k].short + '</th>'; });
    h += '</tr>';
    for (var i = 0; i < 6; i++) {
      var tot = 1 / (1 / sp.big[i] + 1 / sp.reg[i]);
      h += '<tr><td>' + (i + 1) + '</td><td>1/' + sp.big[i].toFixed(1) + '</td><td>1/' + sp.reg[i].toFixed(1) + '</td><td>1/' + tot.toFixed(1) + '</td><td>' + sp.payout[i].toFixed(1) + '%</td>';
      keys.forEach(function (k) { h += '<td>1/' + sp.grape[k].v[i].toFixed(2) + '</td>'; });
      h += '</tr>';
    }
    $('spec').innerHTML = h;
    var nh = '<div style="font-weight:700">' + sp.name + '</div>';
    sp.notes.concat(['結果は「設定がいくつか」の断定ではなく、入力した数字から計算した可能性の目安です。']).forEach(function (t) { nh += '<div>' + t + '</div>'; });
    $('specNotes').innerHTML = nh;
  }

  /* ---------- events ---------- */
  function bump(field, d) {
    var m = cur();
    m[field] = Math.max(0, m[field] + d);
    touch(); renderCounts(); renderResult();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act],.chip,.tile,#undoTap,#reset,#remove,#reload') : null;
    if (!t) return;
    if (t.id === 'reload') { location.reload(); return; }
    var m = cur();
    if (t.dataset.act) {
      var a = t.dataset.act;
      if (a === 'big+') bump('big', 1); else if (a === 'big-') bump('big', -1);
      else if (a === 'reg+') bump('reg', 1); else if (a === 'reg-') bump('reg', -1);
      else if (a === 'saveRec') {
        archive(m); touch(); renderHist();
        t.textContent = '保存しました'; setTimeout(function () { t.textContent = 'この台を記録に保存'; }, 1500);
      }
      else if (a === 'netSign') { m.neg = !m.neg; addPoint(m); touch(); renderMedals(); }
      else if (a === 'ptUndo') { m.pts.pop(); touch(); renderMedals(); }
      else if (a === 'ptClear') { m.pts = []; touch(); renderMedals(); }
      else if (a === 'csv') exportCsv();
      else if (a === 'saveImg') saveImage(t);
      else if (a === 'hdel') { state.history = state.history.filter(function (x) { return x.id !== t.dataset.hid; }); touch(); renderHist(); }
      else if (a === 'hclear') {
        if (t.dataset.confirm !== '1') {
          t.dataset.confirm = '1'; t.textContent = 'もう一度押すと全部消えます';
          setTimeout(function () { t.dataset.confirm = ''; t.textContent = '記録をすべて消す'; }, 3000);
        } else { t.dataset.confirm = ''; t.textContent = '記録をすべて消す'; state.history = []; touch(); renderHist(); }
      }
      else if (a === 'grapeSync') { m.grapeGames = m.games; touch(); renderCounts(); renderResult(); }
      return;
    }
    if (t.classList.contains('tile')) { tap(t.dataset.kind); return; }
    if (t.id === 'undoTap') { undoTap(); return; }
    if (t.id === 'addMachine') {
      var nm = blank((state.machines.length + 1) + '台目', m.mach, m.shop);
      state.machines.push(nm); state.cur = nm.id;
      touch(); renderAll();
      return;
    }
    if (t.classList.contains('chip') && t.dataset.id) {
      state.cur = t.dataset.id; touch(); renderAll();
      return;
    }
    if (t.id === 'reset' || t.id === 'remove') {
      if (t.dataset.confirm !== '1') {
        t.dataset.confirm = '1';
        var old = t.textContent;
        t.textContent = 'もう一度押すと実行します';
        setTimeout(function () { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = old; } }, 3000);
        return;
      }
      if (t.id === 'reset') {
        m.games = 0; m.big = 0; m.reg = 0; m.grapeGames = 0; m.grape = 0; m.cherry = 0; m.bell = 0; m.clown = 0; m.replay = 0; m.miss = 0; m.inv = 0; m.na = 0; m.neg = false; m.pts = []; taps[m.id] = [];
      } else {
        state.machines = state.machines.filter(function (x) { return x.id !== m.id; });
        if (!state.machines.length) state.machines.push(blank('1台目', m.mach, m.shop));
        state.cur = state.machines[0].id;
      }
      touch(); renderAll();
      t.dataset.confirm = '';
      t.textContent = t.id === 'reset' ? 'この台の数字をゼロに戻す' : 'この台を削除';
    }
  });

  $('games').addEventListener('input', function (e) { cur().games = num(e.target.value); touch(); renderCounts(); renderResult(); });
  $('grapeGames').addEventListener('input', function (e) { cur().grapeGames = num(e.target.value); touch(); renderCounts(); renderResult(); });
  $('games').addEventListener('blur', renderCounts);
  $('grapeGames').addEventListener('blur', renderCounts);
  $('inv').addEventListener('input', function (e) { cur().inv = num(e.target.value, 9999999); touch(); renderMedals(); });
  $('net').addEventListener('input', function (e) { cur().na = num(e.target.value, 9999999); touch(); renderMedals(); });
  $('net').addEventListener('change', function () { addPoint(cur()); touch(); renderMedals(); });
  $('inv').addEventListener('blur', renderMedals);
  $('net').addEventListener('blur', renderMedals);
  $('mname').addEventListener('input', function (e) {
    cur().name = e.target.value.slice(0, 20) || '台';
    touch(); renderChips();
  });
  $('mshop').addEventListener('input', function (e) { cur().shop = e.target.value.slice(0, 30); touch(); renderTools(); });
  $('mno').addEventListener('input', function (e) { cur().no = e.target.value.slice(0, 10); touch(); renderChips(); renderTools(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && rollover()) renderAll(); });
  $('preset').addEventListener('change', function (e) { cur().preset = e.target.value; touch(); renderCounts(); renderResult(); });
  $('mach').addEventListener('change', function (e) {
    var m = cur(); m.mach = e.target.value; m.preset = machineOf(m.mach).def;
    touch(); renderAll();
  });

  /* ---------- sync (private to each signed-in viewer; works offline-only elsewhere) ---------- */
  var col = null, dirty = false, flushT = null, flushing = false;
  function setSync(t) { $('sync').textContent = t; }
  function queue() {
    if (!col) return;
    dirty = true;
    clearTimeout(flushT);
    flushT = setTimeout(flush, 1000);
  }
  async function flush() {
    if (!col || flushing || !dirty) return;
    flushing = true; dirty = false;
    var retry = false;
    try {
      await col.doc('state').set({ v: 1, updated: state.updated, cur: state.cur, machines: state.machines, history: state.history });
      setSync('');
    } catch (e) {
      setSync('同期できません');
      if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { dirty = true; retry = true; }
    } finally {
      flushing = false;
      if (dirty) { clearTimeout(flushT); flushT = setTimeout(flush, retry ? 8000 : 1000); }
    }
  }
  async function initCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      var db = await window.claude.use('db');
      var user = await window.claude.use('user');
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      col = db.collection('data/users/' + uid);
      col.doc('state').onSnapshot(function (snap) {
        if (!snap.exists) { if (state.updated > 0) queue(); return; }
        var v = snap.data();
        var remoteT = Number(v.updated) || 0;
        if (remoteT > state.updated) {
          var next = normalize(clone(v));
          if (next) { state = next; rollover(); saveLocal(); renderAll(); }
        } else if (state.updated > remoteT) {
          queue();
        }
      }, function () { col = null; });
    } catch (e) { col = null; }
  }

  rollover();
  renderAll();
  initCloud();
})();
</script>
</body></html>
